# Requires an NGINX ingress controller. For automatic TLS, install cert-manager and
# uncomment the cluster-issuer annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orgflow
  namespace: orgflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [orgflow.example.com]
      secretName: orgflow-tls
  rules:
    - host: orgflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
