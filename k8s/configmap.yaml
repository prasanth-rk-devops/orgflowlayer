apiVersion: v1
kind: ConfigMap
metadata:
  name: orgflow-config
  namespace: orgflow
data:
  NODE_ENV: "production"
  PORT: "4000"
  JWT_EXPIRES_IN: "8h"
  ADMIN_EMAIL: "admin@yourcompany.com"
  SEED_DEMO: "false"
  APP_URL: "https://orgflow.example.com"
  CORS_ORIGIN: "https://orgflow.example.com"
  UPLOAD_DIR: "/app/uploads"
  SMTP_HOST: "smtp.yourcompany.com"
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_FROM: "OrgFlow <no-reply@yourcompany.com>"
