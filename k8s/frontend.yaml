apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: orgflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: orgflow-frontend:1.0.0   # push your built image to a registry and update this
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: orgflow
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
